# MobileNetV4-Hybrid-Medium at 448px, light recipe + MixUp/CutMix (alpha 0.1).
#
# Second pass on the sweep's accuracy leader. hybrid_medium @ 448 with the light
# recipe reached test top-1 0.758 / top-5 0.904 - the best so far - but overfit
# (train ~0.92 vs test ~0.76). This adds ONE lever, gentle MixUp+CutMix, to see
# whether closing the gap pushes the ceiling higher. Identical to
# mobilenetv4_hybrid_medium_448_light.yaml except for the mixup block and output.
#
#     python scripts/fish_classifier_train.py --config configs/mobilenetv4_hybrid_medium_448_mixup.yaml \
#         --data-dir D:\Thalamus\data\split_capped
#
# alpha 0.1 gentle; MixUp stage-2 only; TRAIN accuracy is approximate under
# mixing ('acc~') - judge on val/test. Note hybrid's Mobile MQA attention blocks
# still make it the harder backbone to quantise for the phone; this run measures
# the accuracy ceiling, while conv_medium remains the shipping candidate.

# ---- Model ----
model_name: mobilenetv4_hybrid_medium

num_classes: null

img_size: 448
resize_mode: stretch

# ---- Data ----
data_dir: data
num_workers: 2

# ---- Optimisation ----
batch_size: 8
seed: 42

lr_head: 0.001
epochs_head: 10

lr_finetune: 0.0001
epochs_finetune: 20

progressive_unfreeze: true

# ---- Regularisation (light + gentle MixUp) ----
label_smoothing: 0.1
weight_decay: 0.05
balanced_sampler: true

augmentation:
  random_resized_crop: true
  rrc_scale: [0.65, 1.0]
  coarse_dropout: false
  val_center_crop: true         # MIRROR THIS IN THE APP'S PREPROCESSING

mixup:
  alpha: 0.1
  mixup: true
  cutmix: true

# ---- Output ----
output_dir: models_v4/mobilenetv4_hybrid_medium_448_mixup
stage1_checkpoint: best_model_stage1.pth
final_checkpoint: best_model_final.pth
onnx_filename: fish_classifier.onnx

onnx_opset: 18
