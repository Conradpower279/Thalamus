# MobileNetV4-Hybrid-Medium at 448px, LIGHT recipe (retry).
#
# Part of the 448px backbone COMPARISON set. This is the RETRY of the hybrid
# 448 run that failed earlier: that failure was over-regularization (full stack:
# MixUp + CutMix + CoarseDropout + aggressive crop), NOT the backbone or the
# resolution. The model underfit - stage-2 collapsed to ~1% and crawled. This
# config uses the LIGHT recipe that actually learned, so it is a fair test of
# hybrid_medium at 448.
#
#     python scripts/fish_classifier_train.py --config configs/mobilenetv4_hybrid_medium_448_light.yaml \
#         --data-dir D:\Thalamus\data\split_capped
#
# Output dir is _448_light (distinct from the abandoned models_v4/
# mobilenetv4_hybrid_medium_448) so the failed run's artifacts are not
# overwritten and the two are not confused.
#
# BACKBONE NOTE: hybrid_medium is the highest-capacity backbone here and was the
# best result so far (light224 -> test top-1 0.662). Its Mobile MQA attention
# blocks are the ops most likely to fall off a TFLite delegate or quantise badly,
# so treat it as the accuracy ceiling reference, not necessarily the shippable
# phone model.

# ---- Model ----
model_name: mobilenetv4_hybrid_medium

num_classes: null

img_size: 448
resize_mode: stretch

# ---- Data ----
data_dir: data
num_workers: 2

# ---- Optimisation ----
# Heaviest backbone at 448 - batch 8 (what fit on the 4GB GPU before).
batch_size: 8
seed: 42

lr_head: 0.001
epochs_head: 10

lr_finetune: 0.0001
epochs_finetune: 20

progressive_unfreeze: true

# ---- Regularisation (light - the recipe that learned) ----
label_smoothing: 0.1
weight_decay: 0.05
balanced_sampler: true

augmentation:
  random_resized_crop: true
  rrc_scale: [0.65, 1.0]
  coarse_dropout: false
  val_center_crop: true         # MIRROR THIS IN THE APP'S PREPROCESSING

mixup:
  alpha: 0.0
  mixup: false
  cutmix: false

# ---- Output ----
output_dir: models_v4/mobilenetv4_hybrid_medium_448_light
stage1_checkpoint: best_model_stage1.pth
final_checkpoint: best_model_final.pth
onnx_filename: fish_classifier.onnx

onnx_opset: 18
