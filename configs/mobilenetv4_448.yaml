# MobileNetV4-Hybrid-Medium at 448px, with the full regularisation stack.
#
# A copy of mobilenetv4_tuned.yaml at double the input resolution. Fish ID is
# fine-grained - fin rays, spot patterns, lateral-line detail are only a few
# pixels wide at 224 - so 448 gives the model the pixels to resolve exactly
# those cues. It commonly buys several points of top-1 on fine-grained tasks.
#
#     python scripts/fish_classifier_train.py --config configs/mobilenetv4_448.yaml \
#         --data-dir <your data root>
#
# Three things that make or break 448 - read before running:
#
# 1. COST. Each step processes ~4x the pixels of 224: expect roughly 3-4x the
#    wall-clock per epoch and ~4x the activation memory. batch_size is dropped
#    to 8 for that reason; lower it further (or raise it) to fit your GPU. This
#    is also ~4x the on-device inference cost - MEASURE ON THE TARGET PHONE
#    before treating 448 as shippable. 384 is a lighter middle ground if 448 is
#    too slow on-device (change img_size below and at export).
#
# 2. SOURCE RESOLUTION. 448 only helps if the pixels are real. If your images
#    were prepared with prepare_images.py --max-size 640 (or downloaded at the
#    small "medium" iNaturalist size), most are too small and 448 just upscales
#    invented detail. Prepare at --max-size 768 or higher, and check the audit's
#    reported short-side percentiles sit comfortably above 448.
#
# 3. EXPORT MUST MATCH. Export with the matching resolution or the TFLite model
#    is wrong:  python export/export_tflite.py --img-size 448 ...

# ---- Model ----
model_name: mobilenetv4_hybrid_medium

num_classes: null

img_size: 448
resize_mode: stretch

# ---- Data ----
data_dir: data
num_workers: 2

# ---- Optimisation ----
batch_size: 8        # ~4x the memory per image at 448; tune to your GPU.
seed: 42

lr_head: 0.001
epochs_head: 15

lr_finetune: 0.0001
epochs_finetune: 20

progressive_unfreeze: true

# ---- Regularisation (see mobilenetv4_tuned.yaml for the rationale) ----
label_smoothing: 0.1
weight_decay: 0.05
balanced_sampler: true

augmentation:
  random_resized_crop: true
  rrc_scale: [0.5, 1.0]
  coarse_dropout: true          # hole size scales with img_size automatically
  val_center_crop: true         # MIRROR THIS IN THE APP'S PREPROCESSING

mixup:
  alpha: 0.2
  mixup: true
  cutmix: true

# ---- Output ----
output_dir: models_v4/mobilenetv4_hybrid_medium_448
stage1_checkpoint: best_model_stage1.pth
final_checkpoint: best_model_final.pth
onnx_filename: fish_classifier.onnx

onnx_opset: 18
