# MobileViT-v2-200 (ImageNet-21k) at 384px - the small-transformer family entry.
#
# A mobile conv+attention hybrid, like hybrid_medium but a different lineage. It
# is the motivated pick from the MobileViT / EfficientViT / FastViT family because
# it is the ONLY edge-sized variant in timm with BOTH levers your results say
# matter: ImageNet-21k pretraining AND a native 384px fine-tune. EfficientViT and
# FastViT are ImageNet-1k only, which your sweep suggests lands ~72-77% (lateral
# to hybrid_medium's 0.758). So this is the one with a real shot at moving.
#
#     python scripts/fish_classifier_train.py --config configs/mobilevitv2_200_384.yaml \
#         --data-dir /content/raw_fish          # (Colab) or your local split
#
# BACKBONE: mobilevitv2_200.cvnets_in22k_ft_in1k_384 - MobileViT-v2 width 2.0,
# ~17.8M params. Still edge-class (between conv_medium 9M and hybrid_medium 11M in
# spirit; ~1.6x hybrid), so unlike the ConvNeXt-Base ceiling-reference this stays
# a plausible deployment candidate. Compare against hybrid_medium_448_light
# (0.758) - same edge class, but this adds 21k pretraining.
#
# NOTE: MobileViT attention blocks, like hybrid_medium's Mobile MQA, are the ops
# most at risk of quantising badly / falling off a TFLite delegate - treat TFLite
# export as something to verify, not assume.

# ---- Model ----
model_name: mobilevitv2_200.cvnets_in22k_ft_in1k_384

num_classes: null

img_size: 384
resize_mode: stretch

# ---- Data ----
data_dir: data
num_workers: 2

# ---- Optimisation ----
# ~18M params at 384 - lighter than ConvNeXt-Base, so batch 16 fits comfortably
# on a T4 (16GB) and likely on a smaller GPU. Drop to 8 if VRAM is tight.
batch_size: 16
seed: 42

lr_head: 0.001
epochs_head: 10

# Lower fine-tune LR than the mobile-conv runs (1e-4) to preserve the rich 21k
# features in stage 2; 5e-5 is a safe transformer fine-tune rate.
lr_finetune: 0.00005
epochs_finetune: 20

progressive_unfreeze: true

# ---- Regularisation (light - identical to the hybrid_medium baseline) ----
# Same recipe as hybrid_medium_448_light so the comparison stays one-variable
# (backbone + 21k pretraining). One-lever-at-a-time per the over-regularisation
# lesson - do not stack new regularisers on top.
label_smoothing: 0.1
weight_decay: 0.05
balanced_sampler: true

augmentation:
  random_resized_crop: true
  rrc_scale: [0.65, 1.0]
  coarse_dropout: false
  val_center_crop: true

mixup:
  alpha: 0.0
  mixup: false
  cutmix: false

# ---- Output ----
output_dir: models_v4/mobilevitv2_200_384
stage1_checkpoint: best_model_stage1.pth
final_checkpoint: best_model_final.pth
onnx_filename: fish_classifier.onnx

onnx_opset: 18
