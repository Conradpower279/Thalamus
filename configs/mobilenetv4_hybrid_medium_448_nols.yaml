# MobileNetV4-Hybrid-Medium at 448px, light recipe MINUS label smoothing.
#
# One-lever test on the sweep's accuracy leader. hybrid_medium @ 448 with the
# light recipe reached test top-1 0.758 / top-5 0.904 - the best so far - but
# overfit (train ~0.92 vs test ~0.76). Adding regularisation (the _mixup run)
# did NOT raise test accuracy (0.752), so the ceiling is not "needs more
# regularisation". This config instead REMOVES one regulariser - label smoothing
# - on the hypothesis that, on a fine-grained task whose hard cases are near-
# identical sibling species, label smoothing is blurring the very decision
# boundaries it needs sharp (and capping confidence on correct predictions).
#
# Identical to mobilenetv4_hybrid_medium_448_light.yaml in EVERY other respect,
# so any change is attributable to label_smoothing alone (per the one-lever-at-a-
# time rule from the over-regularisation lesson).
#
#     python scripts/fish_classifier_train.py --config configs/mobilenetv4_hybrid_medium_448_nols.yaml \
#         --data-dir D:\Thalamus\data\split_capped
#
# Read it on test top-1/top-5 AND the error anatomy (scripts eval): the question
# is whether removing smoothing sharpens the sibling-pair boundaries, even if the
# train/test gap stays. If test accuracy DROPS, smoothing was helping - revert.

# ---- Model ----
model_name: mobilenetv4_hybrid_medium

num_classes: null

img_size: 448
resize_mode: stretch

# ---- Data ----
data_dir: data
num_workers: 2

# ---- Optimisation ----
# Heaviest backbone at 448 - batch 8 (what fit on the 4GB GPU before).
batch_size: 8
seed: 42

lr_head: 0.001
epochs_head: 10

lr_finetune: 0.0001
epochs_finetune: 20

progressive_unfreeze: true

# ---- Regularisation (light, but label smoothing OFF - the one changed lever) ----
label_smoothing: 0.0          # was 0.1 in _light; the single lever under test
weight_decay: 0.05
balanced_sampler: true

augmentation:
  random_resized_crop: true
  rrc_scale: [0.65, 1.0]
  coarse_dropout: false
  val_center_crop: true         # MIRROR THIS IN THE APP'S PREPROCESSING

mixup:
  alpha: 0.0
  mixup: false
  cutmix: false

# ---- Output ----
output_dir: models_v4/mobilenetv4_hybrid_medium_448_nols
stage1_checkpoint: best_model_stage1.pth
final_checkpoint: best_model_final.pth
onnx_filename: fish_classifier.onnx

onnx_opset: 18
