name: tests

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      # The tests build models with pretrained=False, so nothing needs to reach
      # the network. Stop albumentations from phoning home for a version check.
      NO_ALBUMENTATIONS_UPDATE: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install CPU-only torch
        # The default PyPI wheel drags in ~2 GB of CUDA libraries that a GitHub
        # runner has no GPU to use. Installing from the CPU index first means the
        # pin in requirements.txt is already satisfied when pip gets there.
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch==2.5.1

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Show installed versions
        run: pip list

      - name: Check scripts compile
        run: python -m compileall -q scripts export tests

      - name: Run tests
        run: pytest -v --junit-xml=test-results.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results.xml
          if-no-files-found: ignore
